<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carreteras federales de Baja California</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="demo-page">
    <section class="route-map route-map--bc" id="bcRouteMap" aria-labelledby="mapTitle">
      <header class="route-map__header">
        <div class="route-map__intro">
          <p class="route-map__eyebrow">Conectividad terrestre</p>
          <h1 id="mapTitle">Carreteras federales de Baja California</h1>
          <p id="mapInstructions" class="route-map__description">
            Selecciona un municipio o una carretera para abrir su información temporal.
          </p>
        </div>

        <label class="destination-picker" for="destinationSelect">
          <span class="destination-picker__label">Seleccionar elemento</span>
          <select id="destinationSelect" disabled>
            <option value="">Cargando mapa…</option>
          </select>
        </label>
      </header>

      <div class="map-experience" id="mapExperience">
        <div class="map-viewport" id="mapViewport">
          <svg
            id="mexicoMap"
            class="mexico-map"
            role="img"
            aria-labelledby="mapSvgTitle mapSvgDescription"
            aria-describedby="mapInstructions"
          >
            <title id="mapSvgTitle">Mapa de carreteras federales y municipios de Baja California</title>
            <desc id="mapSvgDescription">
              Mapa de los siete municipios de Baja California con la red carretera federal principal.
            </desc>
          </svg>

          <div class="map-legend" aria-hidden="true">
            <span class="map-legend__item"><span class="map-legend__line map-legend__line--free"></span>Federal libre</span>
            <span class="map-legend__item"><span class="map-legend__line map-legend__line--toll"></span>Federal cuota</span>
            <span class="map-legend__item"><span class="map-legend__line map-legend__line--integrated"></span>Mixta libre/cuota</span>
          </div>

          <div class="map-loading" id="mapLoading" role="status">
            <span class="map-loading__spinner" aria-hidden="true"></span>
            <span id="mapLoadingText">Cargando mapa…</span>
          </div>
        </div>

        <article
          class="destination-popup"
          id="destinationPopup"
          role="dialog"
          aria-modal="false"
          aria-labelledby="popupTitle"
          hidden
        >
          <button
            class="destination-popup__close"
            id="popupClose"
            type="button"
            aria-label="Cerrar información"
          >
            <span aria-hidden="true">×</span>
          </button>

          <div class="destination-popup__media">
            <img
              id="popupImage"
              src=""
              alt=""
              width="640"
              height="360"
              loading="lazy"
              decoding="async"
            >
          </div>

          <div class="destination-popup__content">
            <p class="destination-popup__eyebrow" id="popupEyebrow"></p>
            <div class="destination-popup__heading-row">
              <h2 id="popupTitle"></h2>
              <span class="destination-popup__code" id="popupCode"></span>
            </div>
            <p class="destination-popup__airport" id="popupAirport"></p>
            <p class="destination-popup__description" id="popupDescription"></p>
            <p class="destination-popup__hours" id="popupHours" hidden></p>

            <a class="destination-popup__cta" id="popupCta" href="#">
              <span id="popupCtaLabel">Conocer más</span>
              <span aria-hidden="true">→</span>
            </a>
          </div>
        </article>

        <p class="sr-only" id="mapStatus" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
